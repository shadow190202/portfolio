  <text x="832" y="425" fill="#64748b" font-family="Inter, sans-serif" font-size="10.5">Neon Database</text>
  <text x="980" y="416" fill="#ef4444" font-family="Inter, sans-serif" font-size="12" font-weight="700">-₹2,100</text>


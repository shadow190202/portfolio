  <text x="832" y="483" fill="#64748b" font-family="Inter, sans-serif" font-size="10.5">Auth &amp; Sessions</text>
  <text x="980" y="474" fill="#ef4444" font-family="Inter, sans-serif" font-size="12" font-weight="700">-₹1,200</text>

  <!-- Row 4 -->
  <rect x="820" y="504" width="220" height="48" rx="8" fill="#141822"/>
  <text x="832" y="526" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Domain Renewal</text>
  <text x="832" y="541" fill="#64748b" font-family="Inter, sans-serif" font-size="10.5">Infrastructure</text>
  <text x="990" y="532" fill="#ef4444" font-family="Inter, sans-serif" font-size="12" font-weight="700">-₹850</text>

  <rect x="820" y="562" width="220" height="18" rx="4" fill="rgba(56, 189, 248, 0.1)"/>
  <text x="880" y="575" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10.5" font-weight="600">+ Add New Expense</text>


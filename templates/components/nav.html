<header class="fixed top-0 left-0 right-0 z-50 glass-nav transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <!-- Logo / Brand -->
      <a href="#hero" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-purple-500 p-[1.5px] shadow-lg shadow-cyan-500/20 group-hover:scale-105 transition-transform duration-300">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center font-heading font-extrabold text-cyan-400 text-lg">
            S
          </div>
        </div>
        <div class="flex flex-col">
          <span class="font-heading font-bold text-lg text-white group-hover:text-cyan-300 transition-colors">
            {{ data.profile.name }}
          </span>
          <span class="text-xs text-slate-400 font-mono tracking-wider -mt-1">
            AI &amp; Systems
          </span>
        </div>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a href="#hero" class="desktop-nav-link text-cyan-400 font-semibold hover:text-cyan-300 transition-colors">Home</a>
        <a href="#projects" class="desktop-nav-link text-slate-300 hover:text-cyan-300 transition-colors">Projects</a>
        <a href="#skills" class="desktop-nav-link text-slate-300 hover:text-cyan-300 transition-colors">Skills</a>
        <a href="#timeline" class="desktop-nav-link text-slate-300 hover:text-cyan-300 transition-colors">Experience</a>
        <a href="#contact" class="desktop-nav-link text-slate-300 hover:text-cyan-300 transition-colors">Contact</a>
      </nav>

      <!-- Action Button & Status -->
      <div class="hidden md:flex items-center gap-4">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full badge-status text-xs font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse-dot"></span>
          <span>Open for Roles</span>
        </div>
        <a href="#contact" class="btn-primary px-5 py-2 rounded-xl text-sm font-semibold text-white">
          Let's Talk
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <div class="flex md:hidden">
        <button id="mobile-menu-btn" type="button" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 focus:outline-none" aria-label="Toggle Navigation Menu" aria-expanded="false">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-white/10 bg-slate-950/95 backdrop-blur-xl px-4 pt-3 pb-6 space-y-3">
    <a href="#hero" class="mobile-nav-link block px-3 py-2 rounded-lg text-base font-medium text-cyan-400 hover:bg-slate-800/50">Home</a>
    <a href="#projects" class="mobile-nav-link block px-3 py-2 rounded-lg text-base font-medium text-slate-300 hover:text-cyan-300 hover:bg-slate-800/50">Projects</a>
    <a href="#skills" class="mobile-nav-link block px-3 py-2 rounded-lg text-base font-medium text-slate-300 hover:text-cyan-300 hover:bg-slate-800/50">Skills</a>
    <a href="#timeline" class="mobile-nav-link block px-3 py-2 rounded-lg text-base font-medium text-slate-300 hover:text-cyan-300 hover:bg-slate-800/50">Experience</a>
    <a href="#contact" class="mobile-nav-link block px-3 py-2 rounded-lg text-base font-medium text-slate-300 hover:text-cyan-300 hover:bg-slate-800/50">Contact</a>
    <div class="pt-3 border-t border-white/10 flex flex-col gap-3">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full badge-status text-xs font-semibold w-max">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse-dot"></span>
        <span>Open for Roles</span>
      </div>
      <a href="#contact" class="mobile-nav-link btn-primary text-center px-4 py-2.5 rounded-xl text-sm font-semibold text-white">
        Get in Touch
      </a>
    </div>
  </div>
</header>

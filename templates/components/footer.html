<footer class="border-t border-white/10 bg-slate-950/80 backdrop-blur-md py-12 relative z-10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row items-center justify-between gap-6">
      
      <!-- Brand & Copy -->
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-white/10 p-[1px] border border-white/20">
          <div class="w-full h-full bg-slate-950 rounded-[7px] flex items-center justify-center font-heading font-extrabold text-white text-xs">
            {{ data.profile.initials }}
          </div>
        </div>
        <p class="text-xs text-slate-400">
          &copy; {{ year }} {{ data.profile.name }}. All rights reserved.
        </p>
      </div>

      <!-- Quick nav -->
      <div class="flex items-center gap-6 text-xs text-slate-400">
        <a href="/#hero" class="hover:text-white transition-colors">Top</a>
        <a href="/#projects" class="hover:text-white transition-colors">Projects</a>
        <a href="/projects" class="hover:text-white transition-colors">All Projects</a>
        <a href="/#skills" class="hover:text-white transition-colors">Skills</a>
        <a href="/#experience" class="hover:text-white transition-colors">Experience &amp; Education</a>
        <a href="/#contact" class="hover:text-white transition-colors">Contact</a>
      </div>

      <!-- Live Stack Indicator -->
      <div class="flex items-center gap-2 text-xs font-mono text-slate-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span>FastAPI + Tailwind CSS + Next.js Stack</span>
      </div>

    </div>
  </div>
</footer>

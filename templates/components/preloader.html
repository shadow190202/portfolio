<!-- Fullscreen Preloader Curtain with Multilingual Greeting -->
<div id="preloader-curtain" role="status" aria-live="polite" aria-label="Loading {{ data.profile.name }}'s Portfolio">
  <div id="preloader-content" class="text-center px-4 max-w-lg mx-auto flex flex-col items-center select-none">
    
    <!-- Language & Status Indicator Pill -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full badge-minimal text-xs font-mono mb-6 shadow-sm">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse-dot"></span>
      <span id="preloader-lang-indicator" class="text-slate-300 font-medium">English</span>
    </div>

    <!-- Multilingual Animated Welcome Header -->
    <div class="h-20 sm:h-24 flex items-center justify-center overflow-hidden my-1">
      <h1 id="preloader-word" class="font-heading text-4xl sm:text-6xl md:text-7xl font-extrabold text-white tracking-tight">
        Welcome
      </h1>
    </div>

    <!-- Personal Attribution Target -->
    <p class="text-base sm:text-xl font-heading text-slate-300 tracking-wide mt-2">
      to <span class="gradient-text-titanium font-extrabold text-white">{{ data.profile.name }}'s</span> Portfolio
    </p>

    <!-- Sleek Titanium Progress Bar -->
    <div class="w-48 sm:w-64 h-[3px] bg-white/10 rounded-full mt-8 overflow-hidden relative shadow-inner">
      <div id="preloader-progress-bar" class="h-full bg-gradient-to-r from-slate-400 via-white to-slate-200 rounded-full w-0"></div>
    </div>

    <!-- Quick Skip Prompt -->
    <button 
      id="preloader-skip" 
      type="button" 
      class="mt-6 text-[11px] font-mono text-slate-500 hover:text-slate-300 transition-colors uppercase tracking-widest cursor-pointer outline-none focus:text-white"
      aria-label="Skip intro animation"
    >
      Click or press any key to enter
    </button>

  </div>
</div>
